<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="cc.css">
<script src="icons.js"></script>
<style>
body { background: var(--surface); border-bottom: 1px solid var(--border); }
.bar { display: flex; align-items: center; height: 48px; padding: 0 16px; gap: 14px; }
.mark { width: 24px; height: 24px; flex: none; }
.word { font-family: "Segoe UI Semibold", "Segoe UI", sans-serif; font-weight: 600; font-size: 15px; color: var(--ink); }
.sep { width: 1px; height: 20px; background: var(--border); }
.sub { font-size: 13px; color: var(--ink2); }
.badge { display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border: 1px solid var(--border2);
  border-radius: 4px; font-size: 12px; color: var(--ink2); }
.grow { flex: 1; }
.pill { display: flex; align-items: center; gap: 8px; height: 24px; padding: 0 12px; border-radius: 12px;
  background: var(--sunken); font-size: 12px; color: var(--ink2); }
.dot { width: 8px; height: 8px; border-radius: 4px; background: var(--ok); }
.help { color: var(--ink2); cursor: pointer; display: flex; }
</style></head>
<body>
<div class="bar">
  <svg class="mark" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10.2" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
    <path d="M12 3.2v2.2" stroke="var(--ink)" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M12 12 L19.2 14.9" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M12 12 L4.8 9.1" stroke="var(--border2)" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="12" cy="12" r="1.6" fill="var(--ink)"/>
  </svg>
  <div class="word">Current Compass</div>
  <div class="sep"></div>
  <div class="sub">Reproduction application</div>
  <div class="badge" id="badge"></div>
  <div class="grow"></div>
  <div class="pill"><span class="dot"></span><span id="pill"></span></div>
  <div class="help" id="help" title="About this application"></div>
</div>
<script>
function render(d) {
  if (!d) { return; }
  document.getElementById('pill').textContent = d.pill || '';
  document.getElementById('badge').innerHTML = ccIcon('shield') + '<span>' + (d.badge || '') + '</span>';
}
function setup(htmlComponent) {
  window.hc = htmlComponent;
  document.getElementById('help').innerHTML = ccIcon('help');
  document.getElementById('help').onclick = function () { htmlComponent.sendEventToMATLAB('nav', 'about'); };
  htmlComponent.addEventListener('DataChanged', function () { render(htmlComponent.Data); });
  render(htmlComponent.Data);
}
</script>
</body></html>
